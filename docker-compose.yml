# TheBridge — production stack (app + Caddy TLS reverse proxy)
# On the server:  docker compose up -d --build
# Secrets come from the server's .env (never committed).

services:
  app:
    build: .
    image: thebridge-app
    env_file:
      - .env
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MEDIA_DIR: /uploads
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
    volumes:
      - uploads:/uploads
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  uploads:
  caddy_data:
  caddy_config:
