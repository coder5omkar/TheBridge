spring:
  application:
    name: thebridge
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    # Secrets live in the repo-root .env (gitignored). Both locations are optional so
    # production deployments can inject real environment variables instead.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      initialization-fail-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  # Local dev binds loopback; containers override with SERVER_ADDRESS=0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: P30D
    issuer: thebridge
  cors:
    allowed-origins:
      - ${CORS_ORIGINS:http://localhost:5173}
  media:
    # Local fallback folder (used when S3 is disabled or unconfigured)
    local-dir: ${MEDIA_DIR:../uploads}
    s3:
      enabled: ${S3_ENABLED:false}
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-southeast-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
